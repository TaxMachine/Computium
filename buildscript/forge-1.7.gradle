/** Common code for Forge 1.7.10 builds (adapted from FS-Patches). */

apply plugin: 'forge'

project.version = "0.1.1"

group = project.group
archivesBaseName = "${project.archives_base}"

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = "run"
    replace '@VERSION@', project.version
}

// Forge 1.7.10 runs on Java 6 to 8. The whole toolchain (Gradle 4.6,
// ForgeGradle 1.2) must itself run ON Java 8 — see README.
sourceCompatibility = 1.8
targetCompatibility = 1.8

if(project.enable_mixin.toBoolean()) {
    apply from: "buildscript/forge-1.7-mixin.gradle"
}

apply from: "project.gradle"

// Template expansion for mcmod.info (${mcversion}): ForgeGradle exposes
// the MC version only as project.minecraft.version, not as a project
// property, so publish it explicitly for `expand project.properties`.
project.ext.mcversion = project.minecraft_version

dependencies {
    // Compile against the target pack: drop the full modpack jars plus
    // unimixins-all.jar into mods/ (never committed, never shipped).
    // At runtime the launcher provides UniMixins — do NOT embed it.
    compileOnly fileTree(dir: 'mods', include: ['*.jar'])
    // Coremod ASM surgery (ShadedMixinGuardTransformer): FML 1.7.10 ships
    // ASM5 at runtime — compile-only here, never shaded.
    compileOnly 'org.ow2.asm:asm-debug-all:5.0.3'
}

jar {
    from(sourceSets.main.output)

    from {
        configurations.shade.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE', 'META-INF/LICENSE.txt'
}

processResources {
    inputs.property "version", version
    inputs.property "mcversion", project.minecraft.version
    inputs.properties project.ext.getProperties()

    filesMatching('*.info') {
        expand project.properties
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    // Beddium's classes are v61 (Java 17+) bytecode: the Java 8 javac that
    // runs Gradle/FG cannot even READ them, but our injectors reference
    // Beddium types directly (Mixin 0.8.7 validates injector descriptors
    // by exact string match — Object placeholders are rejected). Fork a
    // Java 21 javac for compilation; emitted bytecode stays 1.8
    // (source/target below), so Forge/UniMixins never notice.
    // Override with $COMPUTIUM_JAVAC21 (full path to a javac binary).
    def javac21 = System.getenv("COMPUTIUM_JAVAC21");
    if (javac21 == null || javac21.trim().isEmpty()) {
        // Layout: <modlab>/<repo> + <modlab>/toolchain (this repo) OR
        // <modlab>/mod-template + <modlab>/toolchain (template clones):
        // try both roots, first jdk-21* directory wins.
        def jdk21 = null;
        for (def root : [file("../toolchain"), file("../../toolchain")]) {
            def candidates = root == null ? null : root.listFiles();
            jdk21 = candidates == null ? null : candidates.find { it.name.startsWith("jdk-21") };
            if (jdk21 != null) {
                break;
            }
        }
        javac21 = jdk21 == null ? null : new File(jdk21, "bin/javac").absolutePath;
    }
    if (javac21 != null && new File(javac21).isFile()) {
        options.fork = true;
        options.forkOptions.executable = javac21;
        println("Computium: compiling with forked javac: " + javac21);
    } else {
        println("Computium: WARNING: no Java 21 javac found (set COMPUTIUM_JAVAC21); "
                + "Beddium imports will fail on the Java 8 compiler.");
    }
}

// NO coremod: Computium registers its mixin config through GTNHMixins'
// ILateMixinLoader (implemented by the @Mod class — constructed late,
// everything visible, no discovery-order hazard). A coremod stub was
// tried and REMOVED: FML defines the plugin before UniMixins is added
// (NoClassDefFoundError), and renaming late misses collection.
// Phase 1 stays pure Mixin + runtime GL (see ../ARCHITECTURE.md).

jar {
    archiveName = "computium.jar"
}
